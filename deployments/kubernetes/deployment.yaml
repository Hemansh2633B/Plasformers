apiVersion: apps/v1
kind: Deployment
metadata:
  name: plasformers
spec:
  replicas: 2
  selector:
    matchLabels:
      app: plasformers
  template:
    metadata:
      labels:
        app: plasformers
    spec:
      containers:
        - name: plasformers
          image: plasformers:latest
          imagePullPolicy: IfNotPresent
          args: ["plas", "serve", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: plasformers
spec:
  selector:
    app: plasformers
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
