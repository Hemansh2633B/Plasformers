name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Syntax
        run: python -m compileall plas plasformers scripts tests
      - name: Tests
        run: pytest -q
      - name: Security
        run: bandit -q -r plas plasformers || true
